<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <main>
      <div class="filters">
        <label for="startDate">
          Start date
          <input type="date" id="startDate" />
        </label>
        <label for="endDate">
          End date
          <input type="date" id="endDate" />
        </label>
        <button id="getImagesButton">Get Space Images</button>
      </div>

      <section class="space-fact" aria-live="polite">
        <strong>Did You Know?</strong>
        <p id="randomFact"></p>
      </section>

      <div id="gallery" class="gallery">
        <div class="placeholder">
          <div class="placeholder-icon">🔭</div>
          <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
        </div>
      </div>
    </main>
  </div>

  <dialog id="imageModal" class="image-modal">
    <button id="closeModalButton" class="close-modal" type="button" aria-label="Close modal">&times;</button>
    <div id="modalMedia"></div>
    <div class="modal-details">
      <h2 id="modalTitle"></h2>
      <p id="modalDate"></p>
      <p id="modalExplanation"></p>
    </div>
  </dialog>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
