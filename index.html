<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <div class="filters">
      <input type="date" id="startDate" />
      <input type="date" id="endDate" />
      <button>Get Space Images</button>
    </div>

    <section class="space-fact" aria-labelledby="spaceFactTitle">
      <h2 id="spaceFactTitle">Did You Know?</h2>
      <p id="spaceFact"></p>
    </section>

    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Your space gallery is ready. Choose dates, then click "Get Space Images" to begin.</p>
      </div>
    </div>

    <dialog id="imageModal" class="image-modal" aria-labelledby="modalTitle">
      <button type="button" id="closeModal" class="modal-close">Close</button>
      <img id="modalImage" class="modal-image" alt="" />
      <h2 id="modalTitle"></h2>
      <p id="modalDate"></p>
      <p id="modalExplanation"></p>
      <a id="modalVideoLink" target="_blank" rel="noopener noreferrer" hidden>Watch this APOD video</a>
    </dialog>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
